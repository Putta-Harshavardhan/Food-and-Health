<!doctype html>
<html>
  <head>
    <title>Health @IITJ</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      .login-section {
        height: 750px;
        width: 1500px;

        display: flex;
        justify-content: right;
        align-items: center;

        position: right;

        background-image: url("image4.jpg");

        background-size: cover;
        background-position: center;
      }

      form {
        width: 300px;

        padding: 20px;

        text-align: center;
        margin-right: 40px;

        border: 2px solid black;

        background-color: rgba(255, 255, 255, 100%);
      }

      input {
        width: 100%;

        padding: 8px;

        margin: auto;

        box-sizing: border-box;

        text-align: center;
      }

      input[type="submit"] {
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="login-section">
      <form action="home.html" method="post" style="position: right">
        <h1>Enter the username:</h1>

        <input type="text" name="username" placeholder="Username" required />

        <h1>Enter your password:</h1>

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <br />
        <br />
        
        <br />
        <br />
        <br />
        <input
          type="submit"
          value="Login"
          style="background-image: url(image4.jpg); "
        />
      </form>
    </div>
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    <br />
    
  </body>
</html>
